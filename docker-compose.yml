# ============================================================================
# YueXia 月下 —— Docker Compose (Compose Spec, Docker 28.x)
# 用法：
#   1) cp .env.example .env  并按本机情况填写 MODEL_DIR 等
#   2) docker compose up -d --build
#   3) 浏览器访问 http://<本机IP>:5173
# ============================================================================
services:
  yuexia:
    build:
      context: .
      dockerfile: Dockerfile
    image: yuexia:latest
    container_name: yuexia
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # 容器内模型挂载点（与下方 volumes 对应，entrypoint 会据此覆写 config）
      BRAIN_MODEL_PATH: /models/llm
      START_TTS: ${START_TTS:-1}
      BACKEND_PORT: ${BACKEND_PORT:-5000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      TTS_PORT: ${TTS_PORT:-9880}

    ports:
      # 宿主端口:容器端口  —— 前端是对外访问入口
      - "${FRONTEND_PORT:-5173}:5173"
      - "${BACKEND_PORT:-5000}:5000"
      - "${TTS_PORT:-9880}:9880"

    volumes:
      # 项目代码：bind mount 进容器，改代码无需重建镜像，便于跨机部署
      - .:/app
      # 前端 node_modules：匿名卷遮挡，避免被宿主空目录覆盖（用镜像内安装好的）
      - /app/src/frontend/node_modules
      # 本地 LLM 模型目录：各机器路径不同，由 .env 的 MODEL_DIR 提供（只读挂载）
      - ${MODEL_DIR:-./.empty_model}:/models/llm:ro

    # GPU（需宿主安装 NVIDIA Container Toolkit；Docker Desktop on Windows 需 WSL2）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # 健康检查：前端就绪即视为整体可用
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5173 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
